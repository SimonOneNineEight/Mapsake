<!-- @dsCard group="Screens · First-run" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapsake v2 — 登入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ── Mapsake v1 tokens, carried over (DESIGN.md inheritance) ─────────────── */
  :root{
    --parchment:#F2E8D5; --card:#FBF4E4; --ink:#3A2E22; --ink-soft:#6B5B49;
    --terra:#9E4F2B; --terra-hero:#B5663E; --terra-soft:#E8D5C4;
    --ring:#9E4F2B; --shadow:0 4px 16px rgba(58,46,34,.18);
    --r:14px; --r-pill:9999px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#2E2822;font-family:'Noto Sans TC',sans-serif;color:var(--ink);
       display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0}
  .phone{width:390px;height:844px;background:var(--parchment);border-radius:44px;
         box-shadow:0 12px 48px rgba(0,0,0,.5);overflow:hidden;position:relative;border:6px solid #1a1613}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}
  /* status bar */
  .status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;
          padding:0 28px 6px;font-size:14px;font-weight:500;color:var(--ink)}
  h1,h2,.serif{font-family:'Noto Serif TC',serif}
  /* fake map */
  .map{flex:1;position:relative;background:
       radial-gradient(circle at 30% 40%, #EADFC8 0%, transparent 40%),
       radial-gradient(circle at 70% 60%, #E5D8BE 0%, transparent 35%),
       linear-gradient(160deg,#EFE4CF, #E9DCC3 60%, #E4D6BA);overflow:hidden}
  .landmass{position:absolute;background:#E2CFA9;border:1.5px solid #C9B896;border-radius:40% 60% 55% 45%/50% 45% 55% 50%}
  .landmass.visited{background:var(--terra-hero);opacity:.55;border-color:var(--terra)}
  .pin{position:absolute;width:34px;height:34px;transform:translate(-50%,-100%)}
  .pin svg{filter:drop-shadow(0 2px 4px rgba(58,46,34,.35))}
  .cluster{position:absolute;transform:translate(-50%,-50%);background:var(--terra);color:var(--card);
           font-weight:700;font-size:15px;min-width:40px;height:40px;border-radius:var(--r-pill);
           display:flex;align-items:center;justify-content:center;padding:0 10px;
           border:2.5px solid var(--card);box-shadow:var(--shadow)}
  .cluster small{font-weight:500;font-size:11px;margin-left:3px}
  /* search pill (home) */
  .search-pill{position:absolute;top:14px;left:16px;right:16px;background:var(--card);
               border-radius:var(--r-pill);box-shadow:var(--shadow);padding:14px 18px;
               display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:16px}
  .search-pill .icon{color:var(--terra);font-size:22px;line-height:1;font-weight:700}
  /* bottom tab bar — first-class navigation (FR19) */
  .tabbar{height:84px;background:var(--card);border-top:1px solid rgba(58,46,34,.08);
          display:flex;padding:8px 0 26px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
       color:var(--ink-soft);text-decoration:none}
  .tab.active{color:var(--terra)}
  .tab svg{width:26px;height:26px}
  /* sheets */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
         box-shadow:0 -6px 24px rgba(58,46,34,.22);padding:10px 20px 34px;z-index:5}
  .grabber{width:44px;height:5px;border-radius:3px;background:rgba(58,46,34,.18);margin:4px auto 14px}
  .field{background:var(--parchment);border-radius:var(--r);padding:15px 16px;font-size:17px;
         display:flex;align-items:center;gap:10px;color:var(--ink)}
  .field input{border:none;background:none;font:inherit;color:inherit;outline:none;width:100%}
  .row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid rgba(58,46,34,.07);
       text-decoration:none;color:var(--ink)}
  .row .sub{font-size:13px;color:var(--ink-soft)}
  .btn{display:flex;align-items:center;justify-content:center;background:var(--terra);color:var(--card);
       border-radius:var(--r-pill);padding:16px;font-size:17px;font-weight:500;text-decoration:none;border:none;width:100%}
  .btn.ghost{background:none;color:var(--terra);border:1.5px solid var(--terra)}
  .btn.quiet{background:none;color:var(--ink-soft);padding:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--parchment);border-radius:var(--r-pill);
        padding:8px 14px;font-size:14px;color:var(--ink)}
  .chip.on{background:var(--terra-soft);color:var(--ink);font-weight:500} /* ink text — AA fix (terracotta on the tint was 4.09:1) */
  /* photo grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .ph{aspect-ratio:1;border-radius:10px;position:relative;overflow:hidden}
  .ph .check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
             border:2px solid #fff;background:rgba(0,0,0,.15)}
  .ph.sel .check{background:var(--terra);border-color:#fff}
  .ph.sel .check::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:13px;font-weight:700;
             display:flex;align-items:center;justify-content:center}
  /* save moment */
  .save-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  @keyframes settle{0%{transform:translateY(-90px) scale(1.15);opacity:0}55%{transform:translateY(6px) scale(1);opacity:1}75%{transform:translateY(-4px)}100%{transform:translateY(0)}}
  @keyframes ripple{0%{transform:scale(.3);opacity:.6}100%{transform:scale(2.4);opacity:0}}
  .save-pin{animation:settle .7s cubic-bezier(.2,.8,.3,1.1) both}
  .ripple{position:absolute;width:70px;height:70px;border-radius:50%;border:2.5px solid var(--terra-hero);
          animation:ripple .9s .45s ease-out both}
  @media (prefers-reduced-motion: reduce){.save-pin,.ripple{animation:none}.ripple{display:none}}
  /* re-live glow */
  @keyframes glowpulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.35);opacity:.15}}
  .glow{position:absolute;left:50%;top:58%;width:64px;height:64px;border-radius:50%;
        background:radial-gradient(circle,#E8B48C 0%,rgba(232,180,140,0) 70%);
        transform:translate(-50%,-50%);animation:glowpulse 2.2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.glow{animation:none;opacity:.4}}
  .toast{background:var(--ink);color:var(--card);border-radius:var(--r-pill);padding:10px 20px;font-size:15px}
  /* recap */
  .recap-hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:14px 20px}
  .recap-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(58,46,34,.07)}
  .recap-row:last-child{border:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--terra-hero);flex:none}
  .nav-note{position:absolute;bottom:96px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.75}
  .kbd{position:fixed;left:12px;top:12px;background:rgba(255,255,255,.08);color:#cbbfae;font-size:12px;
       padding:10px 12px;border-radius:10px;max-width:200px;line-height:1.5}
  .kbd a{color:#E8B48C}

/* card overrides: the card IS the phone viewport */
body{background:var(--parchment);padding:0;display:block}
.phone{width:100%;height:100vh;border:none;border-radius:0;box-shadow:none}
.kbd{display:none}
</style>
</head>
<body>
<div class="phone">
<section class="screen active" id="signin">
    <div class="status"><span>9:41</span><span>􀙇 􀖀 􀋂</span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;gap:10px">
      <h2 class="serif" style="font-size:26px;text-align:center;margin-bottom:4px">登入</h2>
      <p style="font-size:14px;color:var(--ink-soft);text-align:center;margin-bottom:18px">你的地圖會安全地保存，換手機也不會不見。</p>
      <a class="btn" href="#search" style="background:#1a1613"> 使用 Apple 登入</a>
      <a class="btn" href="#search" style="background:var(--card);color:var(--ink);box-shadow:var(--shadow)">G 使用 Google 登入</a>
      <a class="btn ghost" href="#search">使用 Email 登入</a>
      <p style="font-size:13px;color:var(--ink-soft);text-align:center;margin-top:16px">用過網頁版的 Mapsake？用同一種方式登入就好。</p>
    </div>
    <div class="nav-note" style="bottom:30px">〔登入後 → 引導記錄第一個回憶（進入搜尋）〕</div>
  </section>
</div>
</body>
</html>
