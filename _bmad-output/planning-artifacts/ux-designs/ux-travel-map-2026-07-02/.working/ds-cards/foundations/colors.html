<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapsake v2 — Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F2E8D5;font-family:'Noto Sans TC',sans-serif;color:#3A2E22;padding:20px}
  h1{font-family:'Noto Serif TC',serif;font-size:20px;margin:0 0 4px}
  p{font-size:12px;color:#6B5B49;margin:0 0 16px}
  .sw{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .chip{width:56px;height:40px;border-radius:10px;box-shadow:0 2px 8px rgba(58,46,34,.15);flex:none}
  .n{font-size:13px;font-weight:500}.h{font-size:11px;color:#6B5B49;font-family:monospace}
</style>
</head>
<body>
  <h1>Sepia Parchment 色票</h1>
  <p>v1 identity carried over — Simon-approved, unchanged for v2.</p>
  <div class="sw"><div class="chip" style="background:#F2E8D5"></div><div><div class="n">parchment 畫布</div><div class="h">#F2E8D5</div></div></div>
  <div class="sw"><div class="chip" style="background:#FBF4E4;border:1px solid #E5D8BE"></div><div><div class="n">card 卡片</div><div class="h">#FBF4E4</div></div></div>
  <div class="sw"><div class="chip" style="background:#3A2E22"></div><div><div class="n">ink 主文字</div><div class="h">#3A2E22</div></div></div>
  <div class="sw"><div class="chip" style="background:#6B5B49"></div><div><div class="n">ink-soft 次文字</div><div class="h">#6B5B49</div></div></div>
  <div class="sw"><div class="chip" style="background:#9E4F2B"></div><div><div class="n">terracotta 動作／連結（AA on cream）</div><div class="h">#9E4F2B</div></div></div>
  <div class="sw"><div class="chip" style="background:#B5663E"></div><div><div class="n">terracotta-hero 地圖填色／圖釘</div><div class="h">#B5663E</div></div></div>
  <div class="sw"><div class="chip" style="background:#E8D5C4"></div><div><div class="n">terracotta-soft 選取／強調底</div><div class="h">#E8D5C4</div></div></div>
  <div class="sw"><div class="chip" style="background:#A33B2E"></div><div><div class="n">destructive 刪除</div><div class="h">#A33B2E</div></div></div>
</body>
</html>
