name: Migration CI

# The migration-safety gates for the shared Supabase (Story 1.4 / AR10). Runs on any change to the
# schema, contracts, tests, or gate scripts. "Regression-safe" — the X1 dual-writer convergence proof
# is a separate surface that becomes runnable with the first real iOS writer (Story 2.1).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/contracts/**'
      - 'supabase/tests/**'
      - 'scripts/migration-*.sh'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/contracts/**'
      - 'supabase/tests/**'
      - 'scripts/migration-*.sh'

jobs:
  gates:
    name: Migration gates (G1–G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No DB needed — static checks first (fast fail).
      - name: G4 — expand/contract lint
        run: ./scripts/migration-expand-contract-lint.sh

      - name: G3 — anti-staleness (armed)
        run: ./scripts/migration-anti-staleness-check.sh

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration to a fresh local Supabase (has the auth schema + roles our RLS needs).
      - name: Start local Supabase + apply migrations
        run: supabase start -x vector,studio,imgproxy,edge-runtime,realtime,inbucket

      - name: G2 — pgTAP (RLS + promote RPC + per-visit exif)
        run: supabase test db

      - name: G1 — consumer contracts (web + ios)
        run: ./scripts/migration-run-consumer-contracts.sh

      - name: Gates green
        run: echo "✅ Migration gates G1–G4 green (regression-safe). Dual-writer convergence is gated by the mapsake-contract-e2e (X1) surface in mapsake-ios, triggered below."

      # Cross-repo trigger: a migration change here must re-run X1 (the only place the semantic dual-writer
      # break is observable). Needs a Simon-added `MAPSAKE_IOS_DISPATCH_TOKEN` secret (a PAT that can POST
      # dispatches to mapsake-ios). Fail-open + loud if absent, so the migration lane isn't blocked on setup.
      - name: Trigger X1 in mapsake-ios (dual-writer convergence)
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.MAPSAKE_IOS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "⚠️  MAPSAKE_IOS_DISPATCH_TOKEN not set — X1 NOT triggered. Add the secret to close the gate (Story 2.1 follow-up)."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SimonOneNineEight/mapsake-ios/dispatches \
            -d '{"event_type":"travel-map-migration"}' \
            && echo "✅ X1 (mapsake-contract-e2e) triggered in mapsake-ios."
